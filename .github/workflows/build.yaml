name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set PRIVATE_REPO_TOKEN when src/updater is private. github.token is enough
  # when the submodule and its nested dependencies are public.
  CHECKOUT_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || github.token }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ make zip \
            libsdl1.2-dev libsdl-mixer1.2-dev

      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --replace-all \
            url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C "$GITHUB_WORKSPACE" submodule sync --recursive
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1

      - name: Build Linux
        shell: bash
        run: make -C src -j"$(nproc)"

      - name: Package Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          package="Bombermaaan-linux"
          rm -rf "$package"
          mkdir -p "$package/bin" "$package/lib" "$package/Levels"
          cp src/Bombermaaan/Bombermaaan "$package/bin/"
          cp src/RESGEN/libbombermaaan.so.1.0.0 "$package/lib/"
          cp src/_Test_/Bombermaaan_1.4.1.628_20240225_win32_menzer/Levels/*.TXT \
            "$package/Levels/"
          cp src/_Test_/Bombermaaan_1.4.1.628_20240225_win32_menzer/{config.xml,Readme.html,COPYING.txt,CHANGELOG.txt} \
            "$package/"
          printf '%s\n' '#!/bin/sh' \
            'ROOT="$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)"' \
            'LD_LIBRARY_PATH="$ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$ROOT/bin/Bombermaaan" "$@"' \
            > "$package/launch.sh"
          chmod +x "$package/launch.sh"
          zip -qr Bombermaaan-linux.zip "$package"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bombermaaan-linux
          path: Bombermaaan-linux.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Install MinGW and SDL dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-SDL_mixer

      - name: Build and package Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          make -C src/RES -f Makefile.win CROSS=1 \
            CPP=x86_64-w64-mingw32-g++ CC=x86_64-w64-mingw32-gcc \
            WINDRES=x86_64-w64-mingw32-windres
          make -C src/RES32 -f Makefile.win CROSS=1 \
            CPP=x86_64-w64-mingw32-g++ CC=x86_64-w64-mingw32-gcc \
            WINDRES=x86_64-w64-mingw32-windres
          make -C src/Bombermaaan -f Makefile.win CROSS=1 \
            CPP=x86_64-w64-mingw32-g++ CC=x86_64-w64-mingw32-gcc \
            WINDRES=x86_64-w64-mingw32-windres \
            SDL_CONFIG=/mingw64/bin/sdl-config

          package="Bombermaaan-windows"
          rm -rf "$package"
          cp -a src/_Test_/Bombermaaan_1.4.1.628_20240225_win32_menzer "$package"
          cp src/Bombermaaan/Bombermaaan_32.exe "$package/Bombermaaan.exe"
          rm -f "$package"/*.dll
          cp src/RES/Bombermaaan.dll "$package/"
          cp src/RES32/Bombermaaan_32.dll "$package/"
          # Collect the MinGW runtime and SDL DLLs required by the newly
          # built 64-bit executable and resource libraries.
          queue=("Bombermaaan.exe" "Bombermaaan.dll" "Bombermaaan_32.dll")
          declare -A seen=()
          while ((${#queue[@]})); do
            file="${queue[0]}"
            queue=("${queue[@]:1}")
            while read -r dependency; do
              [[ -n "$dependency" && -f "$dependency" ]] || continue
              name="$(basename "$dependency")"
              [[ -n "${seen[$name]:-}" ]] && continue
              seen["$name"]=1
              cp "$dependency" "$package/$name"
              queue+=("$name")
            done < <(ldd "$package/$file" 2>/dev/null |
              sed -n 's/.*=> \(\/mingw64\/bin\/[^ ]*\.dll\).*/\1/p')
          done
          zip -qr Bombermaaan-windows.zip "$package"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bombermaaan-windows
          path: Bombermaaan-windows.zip
          if-no-files-found: error

  build-switch:
    name: Build Nintendo Switch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ env.CHECKOUT_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - name: Checkout submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --replace-all \
            url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add \
            url."https://github.com/".insteadOf "ssh://git@github.com/"
          git -C "$GITHUB_WORKSPACE" submodule sync --recursive
          git -C "$GITHUB_WORKSPACE" -c protocol.version=2 \
            submodule update --init --force --recursive --depth=1

      - name: Build Switch in devkitPro container
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_USE_HOST_USER=1 \
            bash src/native-switch/docker-build.sh

      - name: Collect Switch artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Bombermaaan-switch
          cp src/native-switch/{Bombermaaan.nro,game.nro,Bombermaaan.json,Bombermaaan.nacp} \
            Bombermaaan-switch/
          cp src/native-switch/Bombermaaan-icon.png Bombermaaan-switch/
          (cd Bombermaaan-switch && zip -q ../Bombermaaan-switch.zip ./*)

      - name: Upload Switch artifact
        uses: actions/upload-artifact@v4
        with:
          name: bombermaaan-switch
          path: Bombermaaan-switch.zip
          if-no-files-found: error
